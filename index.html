<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendar</title>
<meta name="description" content="A simple, private calendar for events and daily notes. Works offline — your data stays on your device.">
<meta name="theme-color" content="#f7f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calendar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1 class="title"><span id="mMonth"></span> <span id="mYear" class="year"></span></h1>
    <div class="toolbar">
      <button class="btn" id="todayBtn" title="Go to today (T)">Today</button>
      <div class="seg" role="group" aria-label="Change month">
        <button class="icon-btn" id="prevBtn" aria-label="Previous month" title="Previous month">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="icon-btn" id="nextBtn" aria-label="Next month" title="Next month">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
      <button class="icon-btn" id="asstBtn" aria-label="Assistant" title="Assistant (A)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/><path d="M19 15l.8 1.9 1.9.8-1.9.8L19 20.4l-.8-1.9-1.9-.8 1.9-.8z"/></svg>
      </button>
      <button class="icon-btn data-btn" id="dataBtn" aria-label="Your data and backups" title="Your data and backups">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.66 3.13 3 7 3s7-1.34 7-3V6"/><path d="M5 12v6c0 1.66 3.13 3 7 3s7-1.34 7-3v-6"/></svg>
        <span class="badge" id="dataBadge" hidden></span>
      </button>
    </div>
  </header>

  <div class="urgent" id="urgent" hidden></div>

  <main class="layout">
    <section class="month" aria-label="Month view">
      <div class="weekdays" id="weekdays" aria-hidden="true"></div>
      <div class="grid" id="grid"></div>
    </section>

    <aside class="day" aria-label="Selected day">
      <div class="day-head">
        <div class="day-title">
          <div class="dow"><span id="dDow"></span><span class="rel" id="dRel"></span></div>
          <h2 class="date" id="dDate"></h2>
        </div>
        <button class="btn primary add-btn" id="addBtn" title="New event (N)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Event
        </button>
      </div>

      <section class="day-section">
        <h3 class="label">Schedule</h3>
        <ul class="events" id="events"></ul>
      </section>

      <section class="day-section">
        <h3 class="label"><span>Note</span><span class="note-status" id="noteStatus"></span></h3>
        <textarea class="note" id="note" rows="6" placeholder="Anything to remember about this day…"></textarea>
      </section>

      <section class="day-section">
        <h3 class="label"><span>Photos</span><span class="photo-count" id="photoCount"></span></h3>
        <div class="photos" id="photos"></div>
        <div class="photo-actions">
          <label class="btn subtle photo-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.2-1.8A1.5 1.5 0 0 1 10.5 3.5h3a1.5 1.5 0 0 1 1.2.7L15.9 6h1.6A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.5"/></svg>
            Take photo
            <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
          </label>
          <label class="btn subtle photo-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M20.5 15.5l-4.8-4.8a1.5 1.5 0 0 0-2.1 0L5 19.3"/></svg>
            From library
            <input type="file" id="libraryInput" accept="image/*" multiple hidden>
          </label>
        </div>
      </section>
    </aside>
  </main>
</div>

<button class="fab" id="fab" aria-label="New event">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- Event editor -->
<dialog class="sheet" id="eventSheet" aria-labelledby="evSheetTitle">
  <form class="sheet-inner" id="eventForm">
    <div class="grabber" aria-hidden="true"></div>
    <header class="sheet-head">
      <h2 id="evSheetTitle">New event</h2>
      <button type="button" class="icon-btn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="sheet-body">
      <input class="title-input" id="evTitle" placeholder="Event title" required autocomplete="off" maxlength="200" aria-label="Title">
      <div class="row2">
        <label class="field"><span>Date</span><input class="input" type="date" id="evDate" required></label>
        <label class="field" id="evTimeField"><span>Time</span><input class="input" type="time" id="evTime"></label>
      </div>
      <label class="switch-row">
        <span>All day</span>
        <input type="checkbox" class="switch" id="evAllDay">
      </label>
      <label class="switch-row">
        <span>Important<small>Get alerted earlier and keep it at the top</small></span>
        <input type="checkbox" class="switch" id="evImportant">
      </label>
      <div class="field">
        <span>Repeat</span>
        <div class="seg-ctl repeat-ctl" id="repeatCtl" role="radiogroup" aria-label="Repeat">
          <button type="button" data-rep="" aria-pressed="true">Never</button>
          <button type="button" data-rep="daily" aria-pressed="false">Daily</button>
          <button type="button" data-rep="weekly" aria-pressed="false">Weekly</button>
          <button type="button" data-rep="monthly" aria-pressed="false">Monthly</button>
          <button type="button" data-rep="yearly" aria-pressed="false">Yearly</button>
        </div>
        <div class="repeat-more" id="repeatMore" hidden>
          <span class="repeat-sum" id="repeatSum"></span>
          <label class="until"><span>Ends</span><input class="input" type="date" id="evUntil" aria-label="Repeat until"><button type="button" class="clear-until" id="clearUntil" aria-label="Repeat forever">Never</button></label>
        </div>
      </div>
      <label class="field"><span>Details</span><textarea class="input" id="evDesc" rows="3" placeholder="Location, people, links…"></textarea></label>
      <fieldset class="field">
        <legend>Color</legend>
        <div class="swatches" id="swatches"></div>
      </fieldset>
    </div>
    <footer class="sheet-foot">
      <button type="button" class="btn danger-ghost" id="evDelete">Delete</button>
      <span class="spacer"></span>
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </footer>
  </form>
</dialog>

<!-- Data & backup -->
<dialog class="sheet" id="dataSheet" aria-labelledby="dataTitle">
  <div class="sheet-inner">
    <div class="grabber" aria-hidden="true"></div>
    <header class="sheet-head">
      <h2 id="dataTitle">Your data</h2>
      <button type="button" class="icon-btn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="sheet-body" id="dataBody"></div>
  </div>
</dialog>

<!-- Confirm -->
<dialog class="sheet small" id="askSheet" aria-labelledby="askTitle">
  <form method="dialog" class="sheet-inner">
    <div class="sheet-body ask-body">
      <h2 id="askTitle"></h2>
      <p id="askText"></p>
    </div>
    <footer class="sheet-foot">
      <span class="spacer"></span>
      <button class="btn" value="cancel">Cancel</button>
      <button class="btn primary" id="askOk" value="ok">OK</button>
    </footer>
  </form>
</dialog>

<!-- Assistant -->
<dialog class="sheet asst" id="asstSheet" aria-labelledby="asstTitle">
  <div class="sheet-inner asst-inner">
    <div class="grabber" aria-hidden="true"></div>
    <header class="sheet-head">
      <div>
        <h2 id="asstTitle">Assistant</h2>
        <div class="asst-sub" id="asstSub">Private · runs on this device</div>
      </div>
      <div class="asst-head-actions">
        <button type="button" class="icon-btn" id="asstSettingsBtn" aria-label="Assistant settings" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <button type="button" class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </header>
    <div class="asst-tabs" role="tablist">
      <button role="tab" class="tab" data-tab="week" aria-selected="true">This week</button>
      <button role="tab" class="tab" data-tab="ask" aria-selected="false">Ask</button>
    </div>
    <div class="asst-body" id="asstBody"></div>
    <form class="asst-input" id="asstForm" hidden>
      <input id="asstQ" class="input" placeholder="Ask about your events…" autocomplete="off" enterkeyhint="send">
      <button class="btn primary icon-only" aria-label="Send"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
  </div>
</dialog>

<!-- Repeating event: which occurrences? -->
<dialog class="sheet small" id="scopeSheet" aria-labelledby="scopeTitle">
  <form method="dialog" class="sheet-inner">
    <div class="sheet-body ask-body">
      <h2 id="scopeTitle">This is a repeating event</h2>
      <p id="scopeText"></p>
      <div class="scope-opts">
        <button class="btn" value="one">This event only</button>
        <button class="btn" value="future">This and following events</button>
        <button class="btn" value="all">All events in the series</button>
      </div>
    </div>
    <footer class="sheet-foot">
      <span class="spacer"></span>
      <button class="btn" value="cancel">Cancel</button>
    </footer>
  </form>
</dialog>

<!-- Photo viewer -->
<dialog class="viewer" id="viewer" aria-label="Photo">
  <div class="viewer-top">
    <button type="button" class="icon-btn v-btn" data-close aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="v-meta"><strong id="vDate"></strong><span id="vInfo"></span></div>
    <span class="v-count" id="vCount"></span>
  </div>
  <div class="viewer-stage" id="vStage">
    <button type="button" class="v-nav prev" id="vPrev" aria-label="Previous photo"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <img id="vImg" alt="">
    <button type="button" class="v-nav next" id="vNext" aria-label="Next photo"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
  <div class="viewer-bar">
    <button type="button" class="v-act" id="vSave"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg><span id="vSaveLabel">Save to Photos</span></button>
    <button type="button" class="v-act" id="vDelete"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg><span>Remove</span></button>
  </div>
</dialog>

<input type="file" id="restoreInput" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="alerts-core.js" defer></script>
<script src="app.js" defer></script>
<script src="assistant.js" defer></script>
</body>
</html>
